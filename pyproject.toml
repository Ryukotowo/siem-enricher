[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-enricher"
version = "0.1.0"
description = "Сервис обогащения событий SIEM: классификация конфиденциальности, provenance-цепочки, риск-скоринг и применение политик"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Автор ВКР" }]
keywords = ["SIEM", "enrichment", "DLP", "provenance", "sensitivity-classification", "Wazuh"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
# Ядро не требует внешних зависимостей: демонстрация и тесты воспроизводимы офлайн.
dependencies = []

[project.optional-dependencies]
config = ["PyYAML>=6.0"]
service = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
es = ["elasticsearch>=8.13"]
kafka = ["aiokafka>=0.10"]
ml = ["scikit-learn>=1.4", "joblib>=1.4", "pandas>=2.2", "numpy>=1.26"]
redis = ["redis>=5.0"]
http = ["httpx>=0.27"]
all = [
  "PyYAML>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "elasticsearch>=8.13",
  "aiokafka>=0.10",
  "scikit-learn>=1.4",
  "joblib>=1.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
siem-enricher = "siem_enricher.cli:main"

[project.urls]
Documentation = "docs/01-архитектура.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siem_enricher = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["siem_enricher"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/siem_enricher"]
