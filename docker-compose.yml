# Демонстрационный стенд сервиса-обогатителя событий SIEM.
#
#   docker compose up -d --build                  -> redpanda + enricher + redis + mock-siem
#   docker compose --profile producer run --rm producer   -> публикация синтетических событий
#   docker compose --profile observability up -d   -> + Prometheus + Grafana
#   docker compose --profile quickwit up -d        -> + Quickwit (поиск по событиям)
#   docker compose --profile siem up -d            -> + OpenSearch (стенд с индексом алертов)
#
# Веса модели монтируются из ./ml/artifacts и в образ не копируются.
# Для «лёгкого» образа без torch: ENRICHER_ML=0 docker compose build enricher
name: siem-enricher

x-common-env: &common-env
  SIEM_ENRICHER_LOG_LEVEL: INFO
  SIEM_ENRICHER_INSTANCE_ID: enricher-docker-1
  KAFKA_BOOTSTRAP: redpanda:9092

services:
  # --- Брокер событий: основной канал обмена с SIEM ---
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: siem-enricher-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [enricher-net]

  # Создание топиков обмена: исходные и обогащённые события
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: siem-enricher-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      rpk topic create siem.raw.events -p 3 -r 1 --brokers redpanda:9092 || true;
       rpk topic create siem.enriched.events -p 3 -r 1 --brokers redpanda:9092 || true;
       rpk topic list --brokers redpanda:9092
    networks: [enricher-net]

  # --- Сам сервис обогащения ---
  enricher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "${ENRICHER_ML:-1}"
    image: siem-enricher:0.2.0
    container_name: siem-enricher
    environment:
      <<: *common-env
      CONFIG: /app/config/config.docker.json
      ENRICHER_MODE: serve
      RUN_PIPELINE: "1"
      POLICY_MODE: dry_run
      PROVENANCE_BACKEND: sqlite
    ports:
      - "8080:8080"
    volumes:
      - ./var:/app/var
      - state-data:/app/var/state
      - ./config:/app/config:ro
      - ./ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-siem:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [enricher-net]

  # --- Хранилище цепочек происхождения для многонодового развёртывания ---
  redis:
    image: redis:7-alpine
    container_name: siem-enricher-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [enricher-net]

  # --- Заглушка SIEM: принимает обогащённые события по HTTP (приёмник webhook) ---
  mock-siem:
    image: siem-enricher:0.2.0
    container_name: siem-enricher-mock-siem
    entrypoint: ["python", "/app/tools/mock_siem.py"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--out", "/app/var/mock_siem_received.jsonl"]
    volumes:
      - ./var:/app/var
    networks: [enricher-net]

  # --- Поставщик синтетических событий (профиль producer) ---
  producer:
    image: siem-enricher:0.2.0
    profiles: ["producer"]
    container_name: siem-enricher-producer
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      python /app/tools/generate_sample_events.py --scenario mixed --count 120
         --out /app/var/generated.jsonl &&
       python /app/tools/kafka_tool.py publish --bootstrap redpanda:9092
         --topic siem.raw.events --input /app/var/generated.jsonl
    volumes:
      - ./var:/app/var
    networks: [enricher-net]

  # --- Просмотр обогащённых событий из топика (профиль producer) ---
  consumer:
    image: siem-enricher:0.2.0
    profiles: ["producer"]
    container_name: siem-enricher-consumer
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      python /app/tools/kafka_tool.py consume --bootstrap redpanda:9092
         --topic siem.enriched.events --group inspector --limit 10 --from-beginning
         --output /app/var/enriched_from_kafka.jsonl
    volumes:
      - ./var:/app/var
    networks: [enricher-net]

  # --- Поиск по обогащённым событиям (профиль quickwit) ---
  quickwit:
    image: quickwit/quickwit:0.8.1
    profiles: ["quickwit"]
    container_name: siem-enricher-quickwit
    command: ["run"]
    environment:
      QW_ENABLE_OPENTELEMETRY_OTLP_EXPORTER: "false"
    ports:
      - "7280:7280"
    volumes:
      - quickwit-data:/quickwit/qwdata
    networks: [enricher-net]

  quickwit-init:
    image: siem-enricher:0.2.0
    profiles: ["quickwit"]
    container_name: siem-enricher-quickwit-init
    depends_on:
      - quickwit
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      sleep 5;
       python /app/tools/quickwit_demo.py --base http://quickwit:7280
         --input /app/var/enriched_events.jsonl
    volumes:
      - ./var:/app/var
    networks: [enricher-net]

  # --- Открытая SIEM для экспериментального стенда (профиль siem) ---
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    profiles: ["siem"]
    container_name: siem-enricher-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-LocalStand-ChangeMe1!}"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [enricher-net]

  siem-demo:
    image: siem-enricher:0.2.0
    profiles: ["siem"]
    container_name: siem-enricher-siem-demo
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      ES_URL: http://opensearch:9200
      POLICY_MODE: dry_run
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      python /app/tools/seed_opensearch.py --url http://opensearch:9200 --count 120 &&
       python -m siem_enricher run --config /app/config/config.opensearch.json --max-events 120 ;
       python /app/tools/seed_opensearch.py --url http://opensearch:9200 --verify
    volumes:
      - ./var:/app/var
      - ./config:/app/config:ro
      - ./ml/artifacts:/app/ml/artifacts:ro
    networks: [enricher-net]

  # --- Наблюдаемость (профиль observability) ---
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    container_name: siem-enricher-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [enricher-net]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    container_name: siem-enricher-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/siem-enricher.json:ro
    networks: [enricher-net]

volumes:
  state-data:
  redpanda-data:
  redis-data:
  grafana-data:
  opensearch-data:
  quickwit-data:
  prometheus-data:

networks:
  enricher-net:
    driver: bridge
