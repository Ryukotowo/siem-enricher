# Демонстрационный стенд сервиса-обогатителя событий SIEM.
#
#   docker compose up --build                  -> kafka + enricher + redis + mock-siem
#   docker compose --profile producer up       -> публикация синтетических событий в Kafka
#   docker compose --profile observability up  -> + Prometheus + Grafana
#
# Веса модели монтируются из ./ml/artifacts и в образ не копируются.
name: siem-enricher

x-common-env: &common-env
  SIEM_ENRICHER_LOG_LEVEL: INFO
  SIEM_ENRICHER_INSTANCE_ID: enricher-docker-1
  KAFKA_BOOTSTRAP: kafka:9092

services:
  # --- Брокер событий: основной канал обмена с SIEM ---
  kafka:
    image: bitnami/kafka:3.7
    container_name: siem-enricher-kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [enricher-net]

  # Создание топиков обмена: исходные и обогащённые события
  kafka-init:
    image: bitnami/kafka:3.7
    container_name: siem-enricher-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
         --topic siem.raw.events --partitions 3 --replication-factor 1 &&
       kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
         --topic siem.enriched.events --partitions 3 --replication-factor 1 &&
       kafka-topics.sh --bootstrap-server kafka:9092 --list"
    networks: [enricher-net]

  # --- Сам сервис обогащения ---
  enricher:
    build:
      context: .
      dockerfile: Dockerfile
    image: siem-enricher:0.1.0
    container_name: siem-enricher
    environment:
      <<: *common-env
      CONFIG: /app/config/config.docker.json
      ENRICHER_MODE: serve
      POLICY_MODE: dry_run
      PROVENANCE_BACKEND: sqlite
    ports:
      - "8080:8080"   # HTTP API обогащения и /metrics
      - "9101:9101"   # резервный порт метрик
    volumes:
      - ./var:/app/var
      - ./config:/app/config:ro
      - ./ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-siem:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [enricher-net]

  # --- Хранилище цепочек происхождения для многонодового развёртывания ---
  redis:
    image: redis:7-alpine
    container_name: siem-enricher-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [enricher-net]

  # --- Заглушка SIEM: принимает обогащённые события по HTTP (приёмник webhook) ---
  mock-siem:
    image: siem-enricher:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "0"
    container_name: siem-enricher-mock-siem
    entrypoint: ["python", "/app/tools/mock_siem.py"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--out", "/app/var/mock_siem_received.jsonl"]
    volumes:
      - ./var:/app/var
    networks: [enricher-net]

  # --- Поставщик синтетических событий (профиль producer) ---
  producer:
    image: siem-enricher:0.1.0
    profiles: ["producer"]
    container_name: siem-enricher-producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "python /app/tools/generate_sample_events.py --scenario mixed --count 120
         --out /app/var/generated.jsonl &&
       python /app/tools/kafka_tool.py publish --bootstrap kafka:9092
         --topic siem.raw.events --input /app/var/generated.jsonl"
    volumes:
      - ./var:/app/var
    networks: [enricher-net]

  # --- Просмотр обогащённых событий из топика (профиль producer) ---
  consumer:
    image: siem-enricher:0.1.0
    profiles: ["producer"]
    container_name: siem-enricher-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "python /app/tools/kafka_tool.py consume --bootstrap kafka:9092
         --topic siem.enriched.events --group inspector --limit 10 --from-beginning
         --output /app/var/enriched_from_kafka.jsonl"
    volumes:
      - ./var:/app/var
    networks: [enricher-net]

  # --- Открытая SIEM для экспериментального стенда (профиль siem) ---
  # Демонстрирует работу с индексом алертов: source=wazuh_indexer -> sink=elasticsearch.
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    profiles: ["siem"]
    container_name: siem-enricher-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-LocalStand-ChangeMe1!}"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [enricher-net]

  # Засев индекса алертов, обогащение потока из индекса и проверка результата
  siem-demo:
    image: siem-enricher:0.1.0
    profiles: ["siem"]
    container_name: siem-enricher-siem-demo
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      ES_URL: http://opensearch:9200
      POLICY_MODE: dry_run
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "python /app/tools/seed_opensearch.py --url http://opensearch:9200 --count 120 &&
       python -m siem_enricher run --config /app/config/config.opensearch.json --max-events 120 ;
       python /app/tools/seed_opensearch.py --url http://opensearch:9200 --verify"
    volumes:
      - ./var:/app/var
      - ./config:/app/config:ro
      - ./ml/artifacts:/app/ml/artifacts:ro
    networks: [enricher-net]

  # --- Наблюдаемость (профиль observability) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    container_name: siem-enricher-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [enricher-net]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    container_name: siem-enricher-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [enricher-net]

volumes:
  kafka-data:
  redis-data:
  grafana-data:
  opensearch-data:

networks:
  enricher-net:
    driver: bridge
