title: Копирование на съёмный носитель
id: 5f1a0009-0000-4000-8000-000000000009
status: experimental
logsource:
  category: file_event
detection:
  selection_action:
    event.action: [copy, move, archive]
  selection_place:
    file.path|startswith: ["e:\\", "f:\\", "g:\\"]
  condition: selection_action and selection_place
level: critical
