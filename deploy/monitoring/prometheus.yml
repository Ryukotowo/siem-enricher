# Конфигурация Prometheus для стенда сервиса-обогатителя
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: siem-enricher

scrape_configs:
  - job_name: siem-enricher
    metrics_path: /metrics
    static_configs:
      - targets: ["enricher:9101"]
        labels:
          service: siem-enricher
          component: enrichment-pipeline

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
