global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: siem-enricher
    metrics_path: /metrics
    static_configs:
      # сервис на хосте: python -m siem_enricher serve --config config/config.local.json --port 8080
      - targets: ["host.docker.internal:8080"]
        labels:
          instance: local
