# Развёртывание сервиса-обогатителя в Kubernetes.
# Особенности: для нескольких реплик хранилище provenance должно быть сетевым
# (PROVENANCE_BACKEND=redis), иначе цепочки происхождения будут расходиться по подам.
apiVersion: v1
kind: Namespace
metadata:
  name: siem-enrichment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: siem-enricher-config
  namespace: siem-enrichment
data:
  # Для реального развёртывания скопируйте сюда config/config.example.json
  SIEM_ENRICHER_LOG_LEVEL: "INFO"
  PROVENANCE_BACKEND: "redis"
  POLICY_MODE: "dry_run"
---
apiVersion: v1
kind: Secret
metadata:
  name: siem-enricher-secrets
  namespace: siem-enrichment
type: Opaque
stringData:
  ES_URL: "https://wazuh-indexer.security.svc:9200"
  ES_USERNAME: "admin"
  ES_PASSWORD: "CHANGE_ME_BEFORE_DEPLOY"
  REDIS_URL: "redis://redis.siem-enrichment.svc:6379/0"
  POLICY_WEBHOOK_URL: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem-enricher
  namespace: siem-enrichment
  labels:
    app.kubernetes.io/name: siem-enricher
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: siem-enricher
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: siem-enricher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: enricher
          image: siem-enricher:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/app/config/config.docker.json", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - name: ENRICHER_MODE
              value: serve
          envFrom:
            - configMapRef:
                name: siem-enricher-config
            - secretRef:
                name: siem-enricher-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9101
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /app/var
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: siem-enricher
  namespace: siem-enrichment
  labels:
    app.kubernetes.io/name: siem-enricher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: siem-enricher
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9101
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siem-enricher
  namespace: siem-enrichment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: siem-enricher
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: siem-enricher-ingress
  namespace: siem-enrichment
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: siem-enricher
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9101
    - ports:
        - protocol: TCP
          port: 8080
